# One command brings up the whole stack:  docker compose up --build
#
# Startup is ordered by health, not by sleeps:
#   db healthy (pg_isready) -> api migrates + seeds, then serves and reports ready -> web (nginx)
#   serves the built SPA and proxies /api to the api container.
#
# Only the web tier is published to the host. The database port is not published (nothing on the
# host needs it, and it avoids clashing with other local Postgres instances); the API is internal
# and reached through the nginx proxy, so the browser only ever talks to one origin.
name: salesdashboard

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: salesdashboard
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d salesdashboard"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/src/SalesDashboard.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=salesdashboard;Username=app;Password=app"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  db-data:
