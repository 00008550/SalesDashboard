server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Container-local readiness for the Docker health check.
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Proxy the API (and its health endpoints) to the api container, so the browser only ever talks
    # to this one origin — no CORS, and no API base URL baked into the SPA.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown routes serve index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
